services:
  employeedirectoryapi:
    image: employeedirectoryapi
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Employees: "Host=${PROD_HOST};Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    build:
      context: .
      dockerfile: EmployeeDirectoryApi/Dockerfile
  postgres:
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U wbwr -d employeedirectory" ]
      interval: 5s
      retries: 5
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: